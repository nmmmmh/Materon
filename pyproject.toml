[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "materon"
version = "1.0.0"
description = "Environment-modulated material neurons for interpretable crystal graph learning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "the Materon authors"}]
requires-python = ">=3.9,<3.11"
# Versions of the environment used for the paper (Python 3.9.25).
dependencies = [
    "tensorflow==2.9.0",
    "kgcnn==2.1.0",
    "numpy==1.22.4",
    "pandas==1.3.5",
    "scipy==1.7.3",
    "scikit-learn==0.24.1",
    "pymatgen==2022.9.8",
    "h5py==3.7.0",
]

[project.optional-dependencies]
benchmarks = ["matbench==0.6"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["materon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
